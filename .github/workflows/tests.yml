name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiled:
    name: C++ build, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # PYBKT_REQUIRE_CPP makes the install fail instead of silently falling
      # back to pure Python when the C++ build fails.
      - name: Install pyBKT with the C++ extension
        env:
          PYBKT_REQUIRE_CPP: "1"
        run: |
          python -m pip install .
          python -m pip install -r tests/requirements.txt
          python -c "import pyBKT.fit.E_step"

      - name: Run tests
        run: python -m pytest tests

  pure-python:
    name: Pure Python, NumPy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        numpy: ["<2", ">=2"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # The tests import pyBKT from source-py instead of an installed build.
      - name: Install dependencies
        env:
          NUMPY_SPEC: ${{ matrix.numpy }}
        run: |
          python -m pip install "numpy$NUMPY_SPEC" pandas requests scikit-learn
          python -m pip install -r tests/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: source-py
        run: python -m pytest tests
